<div
  class="h-screen w-screen flex items-center justify-center p-4 font-display bg-[url('/assets/images/background2.jpg')] bg-bottom bg-cover bg-thadosoft"
>
  <div
    class="w-full max-w-md bg-white/10 backdrop-blur-[20px] border border-white/20 rounded-2xl shadow-lg p-10 space-y-6"
  >
    <div class="flex flex-col items-center space-y-4">
      <img src="assets/images/logo.jpg" alt="logo" class="h-32 w-32" width="128" height="128" />
      <h2 class="text-2xl font-bold text-black/80">Phần mềm đếm dừa Betrimex</h2>
    </div>
    <form [formGroup]="loginForm" class="space-y-4" (ngSubmit)="onSubmit()">
      <div class="flex flex-col">
        <label for="username" class="block text-sm/6 font-medium text-black/80"
          >Tên đăng nhập</label
        >
        <div class="mt-2">
          <input
            id="username"
            type="username"
            name="username"
            required
            formControlName="username"
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/20 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-thadosoft sm:text-sm/6"
          />
        </div>
      </div>
      <div class="flex flex-col">
        <label for="password" class="block text-sm/6 font-medium text-black/80">Mật khẩu</label>
        <div class="mt-2">
          <input
            id="password"
            type="password"
            name="password"
            required
            formControlName="password"
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/20 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-thadosoft sm:text-sm/6"
          />
        </div>
      </div>
      <p class="text-red-600 font-semibold text-sm mt-1">{{ loginError() }}</p>
      <div class="flex flex-col">
        <a href="#" class="text-sm font-semibold underline">Quên mật khẩu</a>
      </div>
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full flex items-center justify-center gap-2 bg-thadosoft/80 text-white font-semibold px-3 py-1.5 rounded-md hover:bg-thadosoft transition cursor-pointer disabled:cursor-not-allowed"
      >
        <!-- Spinner chỉ hiện khi loading -->
        <svg
          [class.hidden]="!loading()"
          aria-hidden="true"
          role="status"
          class="w-4 h-4 animate-spin text-white"
          viewBox="0 0 100 101"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
            fill="#E5E7EB"
          />
          <path
            d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
            fill="currentColor"
          />
        </svg>

        <!-- Text đổi theo trạng thái loading -->
        <span>{{ loading() ? 'Đang tải…' : 'Đăng Nhập' }}</span>
      </button>
    </form>
  </div>
</div>
