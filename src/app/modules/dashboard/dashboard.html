<div class="h-full min-h-screen flex flex-col bg-white">
  <div class="min-h-screen bg-white font-sans text-slate-800 p-4 lg:pl-12">
    <!-- Header -->
    <app-header></app-header>

    <!-- Stats Grid: Lively Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-10">
      @for (stat of stats; track stat.label) {
      <div
        class="relative overflow-hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl hover:shadow-lime-100 hover:-translate-y-1 transition-all duration-300 group"
      >
        <!-- Background Decoration -->
        <div
          class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-10 transition-transform duration-500 group-hover:scale-150"
          [ngClass]="stat.bgClass"
        ></div>

        <div class="flex items-center justify-between mb-4">
          <div class="p-3 rounded-2xl shadow-inner" [ngClass]="stat.iconBg">
            <svg class="size-6" [ngClass]="stat.iconColor">
              <use [attr.xlink:href]="stat.icon"></use>
            </svg>
          </div>
          @if (stat.trend !== null) {
          <div
            class="flex items-center gap-1 bg-green-50 text-green-600 px-3 py-1 rounded-full text-xs font-bold"
          >
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
              />
            </svg>
            +{{ stat.trend }}%
          </div>
          }
        </div>

        <div class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-1">
          {{ stat.label }}
        </div>
        <div class="text-4xl font-black text-slate-800 tracking-tight">{{ stat.value }}</div>
      </div>
      }
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
      <div
        class="lg:col-span-2 bg-white p-2 rounded-3xl shadow-lg shadow-slate-200/50 border border-slate-100"
      >
        <app-barchart></app-barchart>
      </div>

      <div
        class="lg:col-span-1 bg-white p-2 rounded-3xl shadow-lg shadow-slate-200/50 border border-slate-100"
      >
        <app-linechart [qrData]="qrData"></app-linechart>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
      <div class="lg:col-span-1 bg-white p-2 rounded-3xl shadow-xl border border-slate-100">
        <app-piechart [qrData]="qrData"></app-piechart>
      </div>

      <div class="lg:col-span-1 bg-white p-2 rounded-3xl shadow-xl border border-slate-100">
        <app-auditlog></app-auditlog>
      </div>
    </div>

    <!-- Recent Batches Table -->
    <app-recentproduct></app-recentproduct>


    <div class="mt-10 mb-4 text-center">
      <div
        class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-slate-100 shadow-sm"
      >
        <div class="w-2 h-2 rounded-full bg-lime-500 animate-pulse"></div>
        <span class="text-xs font-bold text-slate-400"
          >Coconut AI System v1.0 • © Thadosoft J.S.C</span
        >
      </div>
    </div>
  </div>
</div>
