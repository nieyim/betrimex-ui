<!-- Header -->
<div class="flex p-6 flex-col md:flex-row gap-4 justify-between items-center">
  <div>
    <h3 class="text-2xl font-bold text-gray-900 text-center md:text-left">Lịch sử tác vụ</h3>
    <p class="text-sm text-gray-500 mt-1 text-center md:text-left">Theo dõi log</p>
  </div>
</div>

<div class="w-full rounded-2xl flex flex-col">
  <!-- Chart Section -->
  <div class="h-full w-full rounded-xl bg-white">
    <div
      class="bg-white rounded-3xl shadow-inner overflow-hidden divide-y divide-slate-100 border border-slate-100"
    >
      @for (log of auditData; track log.id) {
      <!-- Log Item -->
      <div class="p-4 sm:p-5 transition-all duration-200 hover:bg-lime-50/50">
        <div
          class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-2 sm:space-y-0"
        >
          <!-- Action & Username (Left/Top) -->
          <div class="flex flex-col w-full sm:w-3/5">
            <!-- Action - Highlighted -->
            <span class="text-sm font-semibold text-slate-800 leading-tight">
              <span class="text-lime-700 font-extrabold mr-1">•</span>
              {{ log.action }}
            </span>
            <!-- Username -->
            <span class="text-xs text-slate-500 mt-1 ml-3">
              Bởi: <span class="font-medium text-slate-700">{{ log.username }}</span>
            </span>
          </div>

          <!-- Resource & Timestamp (Right/Bottom) -->
          <div class="flex flex-col sm:items-end w-full sm:w-2/5 text-left sm:text-right">
            <!-- Resource -->
            <span
              class="text-sm font-mono text-lime-600 bg-lime-100 px-3 py-1 rounded-full inline-block mb-1 shadow-sm"
            >
              {{ log.resource }}
            </span>
            <!-- Timestamp -->
            <span class="text-xs text-slate-400">
              {{ log.createdAt | date : 'dd/MM/yyyy HH:mm:ss' }}
            </span>
          </div>
        </div>
      </div>
      } @empty {
      <!-- Empty State -->
      <div class="p-6 text-center text-slate-500 italic bg-lime-50">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 inline-block text-lime-500 mr-2"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        Không có dữ liệu audit nào để hiển thị.
      </div>
      }
    </div>
  </div>
</div>
