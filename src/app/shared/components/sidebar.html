<div
  class="h-full bg-gray-100 flex flex-col ease-in-out duration-200"
  [ngClass]="{
    'w-64': !isCollapsed(),
    'w-16': isCollapsed()
  }"
>
  <div class="h-32 flex flex-col justify-between relative">
    <button
      class="absolute top-0 w-9 h-9 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-200 hover:text-gray-800 transition cursor-pointer mt-2"
      (click)="toggleSidebar()"
      [ngClass]="{
        'right-0 mx-2': !isCollapsed(),
        'left-1/2 -translate-x-1/2': isCollapsed()
      }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="flex justify-center items-end h-full pb-2">
      <img
        *ngIf="!isCollapsed()"
        src="assets/images/betrimex.png"
        alt=""
        class="max-h-full object-contain fade-in"
      />
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto space-y-2">
    <a [routerLink]="'/dashboard'" class="block px-2">
      <div
        class="flex items-center p-2 rounded-lg text-gray-600 hover:bg-lime-300 hover:text-betrimex"
        routerLinkActive="bg-lime-300 text-betrimex"
        [ngClass]="{
          'justify-center': isCollapsed(),
          'gap-2': !isCollapsed()
        }"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 fill-current shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
          />
        </svg>

        <span class="font-semibold whitespace-nowrap" *ngIf="!isCollapsed()">Trang quản trị</span>
      </div>
    </a>

    <a [routerLink]="'/coconutcounter'" class="block px-2">
      <div
        class="flex items-center p-2 rounded-lg text-gray-600 hover:bg-lime-300 hover:text-betrimex"
        routerLinkActive="bg-lime-300 text-betrimex"
        [ngClass]="{
          'justify-center': isCollapsed(),
          'gap-2': !isCollapsed()
        }"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.75 6.75h.75v.75h-.75v-.75ZM6.75 16.5h.75v.75h-.75v-.75ZM16.5 6.75h.75v.75h-.75v-.75ZM13.5 13.5h.75v.75h-.75v-.75ZM13.5 19.5h.75v.75h-.75v-.75ZM19.5 13.5h.75v.75h-.75v-.75ZM19.5 19.5h.75v.75h-.75v-.75ZM16.5 16.5h.75v.75h-.75v-.75Z"
          />
        </svg>

        <span class="font-semibold whitespace-nowrap" *ngIf="!isCollapsed()">Đăng ký đếm dừa</span>
      </div>
    </a>

    <a [routerLink]="'/settings'" class="block px-2">
      <div
        class="flex items-center p-2 rounded-lg text-gray-600 hover:bg-lime-300 hover:text-betrimex"
        routerLinkActive="bg-lime-300 text-betrimex"
        [ngClass]="{
          'justify-center': isCollapsed(),
          'gap-2': !isCollapsed()
        }"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        </svg>

        <span class="font-semibold whitespace-nowrap" *ngIf="!isCollapsed()">Cài đặt</span>
      </div>
    </a>
  </nav>

  <div class="p-4 space-y-1" [ngClass]="{ 'flex flex-col items-center p-2': isCollapsed() }">
    <div class="text-gray-700 font-semibold px-2" *ngIf="!isCollapsed()">
      Xin chào, <span class="text-betrimex">{{ userName() }}</span>
    </div>

    <button
      class="w-full flex items-center cursor-pointer rounded-lg bg-transparent text-gray-600 hover:text-red-600 font-semibold transition"
      (click)="onLogout()"
      [ngClass]="{
        'justify-center p-2': isCollapsed(),
        'gap-2 p-2': !isCollapsed()
      }"
      [title]="isCollapsed() ? 'Đăng xuất' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6 shrink-0"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"
        />
      </svg>

      <span class="whitespace-nowrap" *ngIf="!isCollapsed()">Đăng xuất</span>
    </button>
  </div>
</div>
